<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Guitar Ritmo Mobile</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;background:#0b0d1a;color:#eef;font-family:system-ui,sans-serif;overflow:hidden;overscroll-behavior:none}
canvas{position:fixed;left:0;top:0;width:100%;height:100vh;height:100dvh;touch-action:none}#pr,#pb{position:fixed;top:0;width:0}#pr{height:env(safe-area-inset-top,0px)}#pb{height:env(safe-area-inset-bottom,0px)}
.screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;padding:calc(20px + env(safe-area-inset-top,0px)) 14px calc(20px + env(safe-area-inset-bottom,0px));overflow:auto;background:radial-gradient(circle at 50% 0,#2a1550,#0b0d1a 70%)}
.screen[hidden],#bp[hidden]{display:none}h1{margin:0 0 6px;font-size:1.9rem;text-align:center}.sub{opacity:.75;max-width:520px;text-align:center;margin:0 0 14px;font-size:.95rem}
.bar{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;align-items:center;margin-bottom:12px}
button,select,input{font:inherit;color:#fff;background:#262b63;border:1px solid #4a52b8;border-radius:12px;padding:12px 16px}
.main{background:#6a3df0;border-color:#9b7bff;font-weight:700}label{font-size:.95rem}
#list{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px;width:100%;max-width:700px}
.card{position:relative;background:#171b45;border:1px solid #333a8c;border-radius:14px;padding:14px 40px 14px 14px}.card b{display:block;margin-bottom:6px;overflow-wrap:anywhere}.card small{opacity:.7}
.x{position:absolute;right:6px;top:6px;padding:8px 10px;font-size:.8rem;opacity:.7}
#bp{position:fixed;z-index:5;left:10px;top:calc(10px + env(safe-area-inset-top,0px));width:46px;height:46px;padding:0;font-size:1.2rem;background:#0008}
.kb{width:92px;border-width:3px;padding:8px 4px;background:#14173a}.kb b{font-size:1.2rem}.kb small{opacity:.8}input[type=range]{padding:0}
.big{font-size:5rem;font-weight:800;margin:6px 0}

#menu{background:radial-gradient(ellipse at 50% 0,#3a1a8a 0,#160a38 45%,#070312 100%);padding:0;align-items:stretch;overflow-x:hidden}
#menu .beam{position:fixed;top:-12vh;width:34vw;height:78vh;pointer-events:none;background:linear-gradient(180deg,rgba(170,110,255,.42),rgba(170,110,255,0));clip-path:polygon(44% 0,56% 0,100% 100%,0 100%);transform-origin:50% 0;opacity:.55;animation:sw 7s ease-in-out infinite alternate}
#menu .b1{left:-6vw;--a:-14deg;--b:10deg}#menu .b2{right:-6vw;--a:14deg;--b:-10deg;animation-delay:-3s}
@keyframes sw{from{transform:rotate(var(--a))}to{transform:rotate(var(--b))}}
#crowd{position:fixed;left:0;bottom:0;width:100%;pointer-events:none;z-index:0}
#menu .mc{position:relative;z-index:1;width:100%;max-width:640px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top,0px)) 14px 0;display:flex;flex-direction:column;gap:12px;min-height:100%}
#menu .top{display:flex;align-items:center;gap:10px}.sp{flex:1}
#menu .pill{background:#1c1245;border:2px solid #5a3fc0;border-radius:14px;padding:10px 14px;font-weight:600;box-shadow:0 0 10px #6a3fff55}
#menu .rb{width:46px;height:46px;padding:0;border-radius:14px;background:#1c1245;border:2px solid #5a8cff;font-size:1.3rem;font-weight:800;box-shadow:0 0 12px #4a7bff77}
#menu .logo{position:relative;text-align:center;margin:6px 0 4px;height:clamp(96px,26vw,150px)}
#menu .neck{position:absolute;left:50%;top:-6px;width:112%;transform:translateX(-50%);opacity:.9;filter:drop-shadow(0 0 14px #8a3fff)}
#menu h1{position:relative;margin:0;padding-top:clamp(18px,6vw,34px);font:italic 900 clamp(44px,13.5vw,84px)/1 "Arial Black",Impact,system-ui,sans-serif;letter-spacing:-2px;transform:skew(-8deg);text-shadow:0 4px 0 #20095a}
#menu .g{color:#fff;text-shadow:0 0 18px #b79bff,0 4px 0 #3a1a8a}
#menu .r{background:linear-gradient(180deg,#d56bff,#7a2bff);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 14px #b04bff)}
#menu .bolt{position:absolute;left:18%;right:34%;bottom:6px;height:6px;border-radius:4px;background:linear-gradient(90deg,transparent,#ff8a1f,#ffb347);transform:skew(-30deg);box-shadow:0 0 12px #ff8a1f}
#menu .panel{background:#120a30cc;border:2px solid #4a2fb0;border-radius:18px;box-shadow:0 0 18px #6a3fff44,inset 0 0 14px #2a1a6a66}
#menu .desc{display:flex;gap:12px;align-items:center;padding:14px}#menu .desc p{margin:0;font-size:.92rem;line-height:1.35;opacity:.95}
#menu .note{font-size:2.6rem;background:linear-gradient(180deg,#e58bff,#7a2bff);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 8px #b04bff)}
#menu .pu{color:#c58bff}#menu .or{color:#ffb02e}
#menu .add{align-self:center;min-width:min(100%,320px);padding:15px 26px;border-radius:999px;border:3px solid #b79bff;background:linear-gradient(180deg,#8a4dff,#4a1fb8);font:700 1.15rem system-ui;box-shadow:0 0 22px #8a4dffaa,inset 0 2px 6px #ffffff44}
#menu .add span{margin-right:8px;font-size:1.3rem}
#menu .row2{display:flex;gap:10px;flex-wrap:wrap}#menu .f{flex:1 1 200px;display:flex;align-items:center;gap:8px;padding:8px 12px}
#menu .ic{font-size:1.1rem;opacity:.9;letter-spacing:-2px}#menu .f label{opacity:1;font-weight:600;white-space:nowrap}
#menu select,#menu input[type=number]{flex:1;min-width:0;background:#1c1450;border:2px solid #4a3fb0;border-radius:12px;padding:9px 10px;color:#fff;font-size:1rem;color-scheme:dark}
#menu .checks{display:flex;gap:26px;justify-content:center;flex-wrap:wrap}#menu .checks label,.chk{display:flex;align-items:center;gap:10px;font-size:1rem}
#menu input[type=checkbox],.modal input[type=checkbox]{appearance:none;-webkit-appearance:none;width:28px;height:28px;padding:0;border-radius:8px;border:2px solid #4a4a7a;background:#14102b;position:relative;flex:none}
input[type=checkbox]:checked{background:#2f7bff;border-color:#7ab0ff;box-shadow:0 0 12px #2f7bffaa}input[type=checkbox]:checked::after{content:"✓";position:absolute;inset:0;text-align:center;line-height:24px;font-weight:800}
#menu h2{margin:4px 0 0;font-size:1.1rem;color:#c58bff}#menu .sub{margin:0;text-align:center}
#menu #list{max-width:none;grid-template-columns:1fr}
#menu .card{display:flex;align-items:center;gap:10px;background:#120a30cc;border:2px solid #3a2f9a;padding:12px}#menu .card.sel{border-color:#ffd24a;box-shadow:0 0 16px #ffd24a66}
#menu .ct{flex:1;min-width:0}#menu .ct b{margin:0 0 4px}#menu .card .x{position:static;order:3}
#menu .pl{width:44px;height:44px;padding:0;border-radius:50%;background:linear-gradient(180deg,#3ddc4b,#128a2a);border:2px solid #6dff7a;font-size:1rem}
#menu .bt{display:flex;align-items:center;gap:12px;padding:12px;flex-wrap:wrap}#menu .bt .ic{font-size:2rem;letter-spacing:0}#menu .bx{flex:1 1 180px;font-size:.95rem}#menu .bx small{display:block;opacity:.8;margin-top:2px}
#pads{display:flex;gap:8px;justify-content:center}
.kc{--c:#fff;flex:1;min-width:0;padding:8px 2px 10px;border:3px solid var(--c);border-radius:14px;background:#0e0a22;color:#fff;box-shadow:0 0 12px var(--c);display:flex;flex-direction:column;align-items:center}
.kc span{font-size:.72rem}.kc b{font-size:1.6rem;margin:4px 0}.kc i{display:block;width:78%;height:10px;border-radius:6px 6px 14px 14px;background:var(--c);box-shadow:0 0 10px var(--c)}
.kc.on{background:color-mix(in srgb,var(--c) 35%,#0e0a22)}
#menu .act{position:sticky;bottom:0;margin-top:auto;display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;padding:14px 0 calc(10px + env(safe-area-inset-bottom,0px));background:linear-gradient(180deg,transparent,#070312e6 45%)}
#menu .go{flex:1 1 220px;max-width:340px;padding:15px 22px;border-radius:22px;border:3px solid #6dff7a;background:linear-gradient(180deg,#3ddc4b,#128a2a);font:italic 800 1.5rem system-ui;box-shadow:0 0 24px #3ddc4baa,inset 0 3px 8px #ffffff55;text-shadow:0 2px 3px #0a4a14}
.modal{position:fixed;inset:0;z-index:20;background:#000b;display:flex;align-items:center;justify-content:center;padding:16px}.modal[hidden]{display:none}
.mp{width:100%;max-width:440px;background:#140b36;border:2px solid #6a4fe0;border-radius:20px;padding:18px;box-shadow:0 0 30px #6a3fff88;display:flex;flex-direction:column;gap:12px;max-height:88vh;overflow:auto}.mp h3{margin:0;color:#c58bff}.mp p{margin:0;font-size:.93rem;line-height:1.4}
#menu img.logo{display:block;width:min(100%,540px);height:auto;margin:2px auto 0;-webkit-mask-image:radial-gradient(ellipse 50% 54% at 50% 50%,#000 56%,transparent 100%);mask-image:radial-gradient(ellipse 50% 54% at 50% 50%,#000 56%,transparent 100%)}
#menu input[type=checkbox]:checked,.modal input[type=checkbox]:checked{background:#2f7bff;border-color:#7ab0ff;box-shadow:0 0 12px #2f7bffaa}
#menu input[type=checkbox]:not(:checked)::after,.modal input[type=checkbox]:not(:checked)::after{content:none}
#menu .f{min-width:0}#menu input[type=number]{width:0}#menu .row2 .f{flex:1 1 210px}
#menu .act{flex-wrap:nowrap}#menu #prr{flex:none;padding:12px 12px;font-size:.82rem}#menu .go{flex:1 1 0;min-width:0;font-size:1.35rem;padding:14px 12px}
#menu .go{white-space:nowrap;font-size:1.2rem}#menu #prr{font-size:.75rem;padding:12px 10px}
</style></head><body>

<div class="beam b1"></div><div class="beam b2"></div><canvas id="crowd"></canvas>
